<style>
:root{--ink:#2b2a26;--muted:#6f6b62;--line:#e6e1d6;--bg:#f4f1ea;--paper:#fffdf8;--gold:#b5841a;--gold-ink:#6a4d0f;--gold-soft:#f6eccf;--gold-line:#e7cf8e;--rail:232px;--top:52px;--bottom:56px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;overflow:hidden}

.item.placeholder{color:#9a968d;cursor:default;font-size:12.5px}

.rail-foot{padding:12px 16px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);line-height:1.5}

</style>

        if (lm && 시각칸) {
          var d = new Date(lm);
          if (!isNaN(d)) {
            /* sv-SE 로케일은 "2026-09-02 15:42:48" 꼴로 준다. 한국어 로케일은
               "2026. 9. 2. 15시 42분"처럼 나와 손질하다 보면 날짜와 시간이 붙어버린다. */
            시각칸.textContent = d.toLocaleString("sv-SE", { timeZone: "Asia/Seoul" })
              .replace(/-/g, ".") + " 갱신";
          }
        }
        return r.ok ? r.text() : "";
      })
      .then(function (html) {
        // 새 판이 나왔는지는 **번호**로 본다(시각은 캐시 상태에 따라 달라질 수 있다).
        var m = html.match(/id="verNo">\s*(v\d+)\s*</);
        if (!m || m[1] === 지금번호) return;
        var bar = document.createElement("div");
        bar.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:60;background:#b5841a;color:#fff;padding:9px 14px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:center";
        bar.innerHTML = '새로 고친 판이 있어요 <b style="font-weight:800">' + m[1].replace(/</g, "&lt;") + '</b>' +
          '<button style="border:0;border-radius:8px;padding:5px 12px;font:inherit;font-weight:800;cursor:pointer">새로고침</button>';
        bar.querySelector("button").onclick = function () { location.reload(true); };
        document.body.appendChild(bar);
      })
      .catch(function () {});
  }, 3000);   // 첫 화면이 뜨고 난 뒤에 확인한다
})();

function isAdminDevice() { // v61: 24시간 만료 규칙(회의록·관리비와 공통) — 만료된 키는 지우고 관리자 메뉴를 숨긴다
  try {
    var k = localStorage.getItem("sandle_admin_key"); if (!k) return false;
    var at = +localStorage.getItem("sandle_admin_unlock_at") || 0;
    // v107: 「이 기기 기억하기」를 켠 기기는 30일, 아니면 24시간 (회의록 core.js AdminGate와 같은 규칙).
    var ttl = (localStorage.getItem("sandle_admin_trust") === "1") ? 30*24*60*60*1000 : 24*60*60*1000;
    if (!at || (Date.now() - at) > ttl) { localStorage.removeItem("sandle_admin_key"); localStorage.removeItem("sandle_admin_unlock_at"); return false; }
    return true;
  } catch (e) { return false; }
}
function svcOf(it) { return it.service || it.group.service || it.id; }
// 같은 호스트 서비스(iframe 한 벌씩). minutes 는 끼움 모드.
var SERVICES = {
  minutes:   { url: MIN + MINQ, embed: true },
  fees:      { url: FEES },
  community: { url: BASE + "/CommunityNotice/" },
  proposal:  { url: BASE + "/agenda-proposal/?v=1" },
  // iframe src 는 **이곳**에서 읽는다(항목의 url 은 '새 창으로 열기' 단추용).
  // 여기 등록을 빠뜨리면 메뉴를 눌러도 아무 일이 일어나지 않는다 — 2026-09-02에 실제로 그랬다.
  archive:   { url: BASE + "/archive-v1/?v=368" }
};
// 모바일 하단 바(v343): PC·상단과 같은 5개 대분류. 누르면 해당 분류의 첫 화면으로 바로 간다.
var BOTTOM = [
  { group: "minutes",    label: "회의",          ic: "◆", cls: "" },
  { group: "archive",    label: "검색·아카이브", ic: "⌕", cls: "" },
  { group: "rules",      label: "기준·문서",     ic: "▤", cls: "" },
  { group: "management", label: "점검·관리",     ic: "✓", cls: "" },
  { group: "info",       label: "소식·정보",     ic: "◇", cls: "" }
];

var ITEMS = {}; GROUPS.forEach(function (g) { g.items.forEach(function (it) { if (!it.placeholder) { it.group = g; ITEMS[it.id] = it; } }); });
var menu = document.getElementById("menu"), main = document.getElementById("main"), bottom = document.getElementById("bottom");
var openBtn = document.getElementById("openBtn"), openBtnM = document.getElementById("openBtnM"), topTitle = document.getElementById("topTitle");
var contextGroups = document.getElementById("contextGroups"), contextMids = document.getElementById("contextMids");
var contextSubRow = document.getElementById("contextSubRow"), contextSubs = document.getElementById("contextSubs");
var current = null, frames = {}, ready = {};

function firstItem(g) { return g.items.find(function (it) { return !it.placeholder; }); }
function goItem(it) {
  if (!it || it.placeholder) return;
  show(it.id, true);
  closeDrawer();
}
function midEntries(g) {
  var out = [], seenSubgroups = {};
  g.items.forEach(function (it) {
    if (it.child) {
      var subgroup = it.subgroup || "회의 관리";
      if (!seenSubgroups[subgroup]) {
        seenSubgroups[subgroup] = true;
        out.push({ label: subgroup, subgroup: subgroup, target: it });
      }
    } else out.push({ label: it.label, target: it });
  });
  return out;
}
function buttonFor(label, active, cls, onclick, disabled) {
  var b = document.createElement("button");
  b.type = "button"; b.className = "context-btn " + (cls || "") + (active ? " active" : "");
  b.textContent = label; b.disabled = !!disabled;
  if (active) b.setAttribute("aria-current", "page");
  if (!disabled) b.onclick = onclick;
  return b;
}
function renderContext(it) {
  contextGroups.innerHTML = "";
  GROUPS.forEach(function (g) {
    contextGroups.appendChild(buttonFor(g.title, g.id === it.group.id, "", function () { goItem(firstItem(g)); }));
  });

  contextMids.innerHTML = "";
  var activeSubgroup = it.child ? (it.subgroup || "회의 관리") : "";
  midEntries(it.group).forEach(function (entry) {
    var active = entry.subgroup ? entry.subgroup === activeSubgroup : entry.target.id === it.id;
    contextMids.appendChild(buttonFor(entry.label, active, "", function () { goItem(entry.target); }, entry.target.placeholder));
  });

  contextSubs.innerHTML = "";
  var subItems = activeSubgroup ? it.group.items.filter(function (candidate) { return candidate.child; }) : [];
  contextSubRow.hidden = !subItems.length;
  subItems.forEach(function (sub) {
    contextSubs.appendChild(buttonFor(sub.label, sub.id === it.id, "", function () { goItem(sub); }));
  });
}

// 메뉴 그리기
GROUPS.forEach(function (g) {
  var box = document.createElement("div"); box.className = "grp " + g.cls + (g.collapsible ? " collapsible" : ""); box.id = "grp-" + g.id;
  if (g.collapsible) {
    var tb = document.createElement("button"); tb.type = "button"; tb.className = "grp-title toggle";
    tb.innerHTML = '<span class="dot"></span>' + g.title + '<span class="arrow">▸</span>';
    tb.onclick = function () { box.classList.toggle("open"); try { localStorage.setItem("sandle_portal_admin_open", box.classList.contains("open") ? "1" : "0"); } catch (e) {} };
    box.appendChild(tb);
    // 회의록 앱과 같은 규칙: 관리자 키가 있는 기기나 한 번 펼친 기기는 펼친 채로
    try { var v = localStorage.getItem("sandle_portal_admin_open"); if (v === "1" || (v === null && localStorage.getItem("sandle_admin_key"))) box.classList.add("open"); } catch (e) {}
  } else {
    var t = document.createElement("div"); t.className = "grp-title"; t.innerHTML = '<span class="dot"></span>' + g.title; box.appendChild(t);
  }
  var items = document.createElement("div"); items.className = "items";
  var dividerAdded = false;
  g.items.forEach(function (it) {
    // v62: 관리자 메뉴도 항상 표시(🔒 포함) — 숨기면 키 만료 후 비밀번호를 넣을 입구가 없어짐(사용자 요청).
    //      화면 자체는 회의록 앱이 서버 검증으로 잠근다(v69~), 열람/수정 2단계 키는 v92~.
    if (it.adminOnly && !dividerAdded) { var d = document.createElement("div"); d.className = "items-divider"; items.appendChild(d); dividerAdded = true; }
    if (it.subgroup) { var st = document.createElement("div"); st.className = "nav-subtitle"; st.textContent = it.subgroup; items.appendChild(st); }
    var b = document.createElement("button"); b.type = "button"; b.className = "item" + (it.child ? " child" : "") + (it.adminOnly ? " locked" : "") + (it.placeholder ? " placeholder" : ""); b.dataset.id = it.id;
    b.innerHTML = (it.adminOnly ? '<span class="num">🔒</span>' : "") + '<span>' + it.label + '</span>' + (it.external ? '<span class="ext">새 창 ↗</span>' : "");
    if (it.placeholder) { b.disabled = true; b.setAttribute("aria-disabled", "true"); }
    else b.onclick = function () { show(it.id, true); if (it.external) window.open(it.url, "_blank", "noopener"); closeDrawer(); };
    items.appendChild(b);
  });
  box.appendChild(items); menu.appendChild(box);
});
BOTTOM.forEach(function (bt) {
  var b = document.createElement("button"); b.className = bt.cls; b.dataset.group = bt.group; b.innerHTML = '<span class="ic">' + bt.ic + '</span>' + bt.label;
  b.onclick = function () {
    var group = GROUPS.find(function (g) { return g.id === bt.group; });
    goItem(firstItem(group));
  };
  bottom.appendChild(b);
});

// 화면(pane) 준비
function paneFor(key) {
  var p = document.getElementById("pane-" + key);
  if (p) return p;
  p = document.createElement("div"); p.className = "pane"; p.id = "pane-" + key;
  p.innerHTML = '<div class="loading"></div>';
  main.appendChild(p);
  return p;
}
function ensureService(key) {
  var s = SERVICES[key], p = paneFor("svc-" + key);
  if (!frames[key]) {
    var f = document.createElement("iframe"); f.src = s.url; f.title = key; f.setAttribute("allow", "clipboard-write; fullscreen");
    p.classList.add("loading-on");
    f.addEventListener("load", function () { p.classList.remove("loading-on"); });
    p.insertBefore(f, p.firstChild); frames[key] = f;
  }
  return p;
}
function ensureExternal(it) {
  var p = paneFor("ext-" + it.id);
  if (!p.querySelector(".ext-pane")) {
    p.innerHTML = '<div class="ext-pane"><div class="ext-card"><h2>' + it.label + ' <span style="color:var(--muted);font-weight:600;font-size:13px">새 창</span></h2>' +
      '<p>' + (it.note || "") + '<br>이 페이지는 노션에 있어 포털 안에 끼워 넣을 수 없어, 새 창으로 열립니다. 포털은 이 창에 그대로 남아 있어요.</p>' +
      '<a class="go" href="' + it.url + '" target="_blank" rel="noopener">' + it.label + ' 열기 ↗</a>' +
      '<small>창이 안 열렸으면 위 단추를 눌러 주세요(팝업 차단).</small></div></div>';
  }
  return p;
}

// 회의록 앱에 화면 전환 요청 — 앱이 준비(ready)되기 전이면 준비된 뒤 보낸다
var pendingView = null;
function selectNoticeSub(frame, sub) {
  if (!sub) return;
  var tries = 0;
  (function apply() {
    tries++;
    try {
      if (frame.contentWindow.Notices && typeof frame.contentWindow.Notices.sub === "function") {
        frame.contentWindow.Notices.sub(sub);
        return;
      }
    } catch (e) {}
    // ready 신호 직후 하위 스크립트가 아직 실행 중인 경우에만 잠깐 다시 시도한다.
    if (tries < 20) setTimeout(apply, 50);
  })();
}
function tellMinutes(view, noticeSub) {
  var f = frames.minutes; if (!f) return;
  if (!ready.minutes) { pendingView = { view: view, noticeSub: noticeSub }; return; }
  try { f.contentWindow.postMessage({ source: "sandle-portal", type: "show", view: view }, location.origin); } catch (e) {}
  if (view === "noticeView") selectNoticeSub(f, noticeSub);
}
window.addEventListener("message", function (e) {
  if (e.origin !== location.origin || !e.data || e.data.source !== "sandle-minutes") return;
  if (e.data.type === "ready") {
    ready.minutes = true;
    if (pendingView) { var v = pendingView; pendingView = null; tellMinutes(v.view, v.noticeSub); }
  } else if (e.data.type === "view" && e.data.view) {
    // 앱 안에서 화면이 바뀌면(예: 시작 시 자동 열기) 메뉴 표시를 맞춘다
    // 같은 noticeView 안의 하위 탭을 왼쪽 메뉴로 연 경우에는 구체적인 메뉴 선택을 유지한다.
    if (current && current.view === e.data.view) return;
    if (ITEMS[e.data.view] && (!current || current.id !== e.data.view)) show(e.data.view, false, true);
  }
});

// 메뉴(세부 화면)마다 화면별 page_view — GA '페이지 및 화면' 보고서에 제목별 행으로 잡힌다
var lastTracked = null;
function trackView(it) {
  if (!window.gtag || lastTracked === it.id) return;
  lastTracked = it.id;
  gtag("event", "page_view", { page_title: document.title, page_location: location.origin + "/#" + it.id });
}
function directUrl(it) {
  if (it.external || it.url) return it.url;
  // 하위 탭은 포털 해시를 거쳐야 새 창에서도 같은 탭이 정확히 선택된다.
  if (it.noticeSub) return BASE + "/#" + it.id;
  return MIN + (it.view && it.view !== "previewView" ? "?tab=" + it.view : "");
}
function show(id, push, fromApp) {
  var it = ITEMS[id] || ITEMS.previewView;
  current = it;
  document.querySelectorAll(".item").forEach(function (b) { b.classList.toggle("active", b.dataset.id === it.id); });
  // 모바일 하단은 현재 화면이 속한 대분류를 표시한다(PC 왼쪽 메뉴와 같은 정보구조).
  document.querySelectorAll(".bottom button").forEach(function (b) { b.classList.toggle("active", b.dataset.group === it.group.id); });
  if (it.group.collapsible) document.getElementById("grp-" + it.group.id).classList.add("open");
  document.querySelectorAll(".pane").forEach(function (p) { p.classList.remove("active"); });
  if (it.external) ensureExternal(it).classList.add("active");
  else {
    var svc = svcOf(it);
    ensureService(svc).classList.add("active");
    if (svc === "minutes" && it.view && !fromApp) tellMinutes(it.view, it.noticeSub);
  }
  var u = directUrl(it); openBtn.href = u; openBtnM.href = u;
  topTitle.textContent = it.group.title + " › " + it.label;
  renderContext(it);
  document.title = "산들마을 입주민 포털 — " + it.label;
  trackView(it);
  if (push) { try { history.replaceState(null, "", "#" + it.id); } catch (e) {} }
}
document.getElementById("reloadBtn").onclick = function () {
  if (!current || current.external) return;
  var svc = svcOf(current), f = frames[svc]; if (!f) return;
  paneFor("svc-" + svc).classList.add("loading-on");
  if (svc === "minutes") { ready.minutes = false; pendingView = { view: current.view, noticeSub: current.noticeSub }; f.src = MIN + MINQ + (current.view && current.view !== "previewView" ? "&tab=" + current.view : ""); }
  else f.src = f.src;
};
// 모바일 서랍
function closeDrawer() { document.body.classList.remove("drawer"); }
document.getElementById("menuBtn").onclick = function () { document.body.classList.toggle("drawer"); };
document.getElementById("scrim").onclick = closeDrawer;
window.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });

window.addEventListener("hashchange", function () { show((location.hash || "").replace(/^#/, ""), false); });
(function () {
  var first = (location.hash || "").replace(/^#/, "") || "previewView";
  var it = ITEMS[first] || ITEMS.previewView;
  // 첫 화면이 회의록 앱 안의 탭이면 iframe 주소에 &tab= 을 붙여 처음부터 그 화면으로(메시지 왕복 없이)
  if (!it.external && (svcOf(it) === "minutes") && it.view && it.view !== "previewView") SERVICES.minutes.url = MIN + MINQ + "&tab=" + it.view;
  show(it.id, false);
})();
</script>
</body>
</html>
