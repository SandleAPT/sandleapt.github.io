<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산들마을 입주민 포털</title>
<meta name="description" content="산들마을 아파트 입주민 포털 — 회의록·업무현황·자료·커뮤니티센터를 한 화면의 탭으로">
<style>
:root{--ink:#2b2a26;--muted:#6f6b62;--line:#e6e1d6;--bg:#f4f1ea;--gold:#b5841a;--gold-soft:#f6eccf;--teal:#3f7fa6;--teal-soft:#e3eef5;--green:#4f7a47;--green-soft:#e8efe5;--top:56px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{height:var(--top);display:flex;align-items:center;gap:10px;padding:0 12px;background:#fffdf8;border-bottom:1px solid var(--line);flex:0 0 auto}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#e8d6a2,#b5841a);display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;flex:0 0 auto}
.brand{font-weight:900;font-size:15px;white-space:nowrap;margin-right:6px}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:1px solid transparent;background:transparent;border-radius:10px;padding:8px 12px;font-size:13.5px;font-weight:700;color:#5c5b56;cursor:pointer;white-space:nowrap}
nav.tabs button:hover{background:#f2eee5}
nav.tabs button.active{background:var(--gold-soft);color:#6a4d0f;border-color:#e7cf8e}
nav.tabs button.t-green.active{background:var(--green-soft);color:#3c6134;border-color:#b9d3ae}
nav.tabs button.t-teal.active{background:var(--teal-soft);color:#2f5f80;border-color:#b9d0e0}
.tools{display:flex;gap:6px;flex:0 0 auto}
.tools a,.tools button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font-size:12px;color:#5c5b56;text-decoration:none;cursor:pointer;white-space:nowrap}
.tools a:hover,.tools button:hover{background:#f7f4ec}
main{flex:1 1 auto;position:relative;min-height:0}
.pane{position:absolute;inset:0;display:none;background:#fff}
.pane.active{display:block}
.pane iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.fallback{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--muted);background:var(--bg)}
.pane.blocked .fallback{display:grid}
.fallback a{display:inline-block;margin-top:10px;padding:10px 16px;border-radius:12px;background:var(--gold);color:#fff;text-decoration:none;font-weight:800}
.loading{position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);animation:bar 1.1s linear infinite;display:none}
.pane.loading-on .loading{display:block}
@keyframes bar{from{background-position:-200px 0}to{background-position:400px 0}}
@media (max-width:640px){.brand{display:none}.tools .hide-sm{display:none}}
</style>
</head>
<body>
<header>
  <div class="logo">산</div><div class="brand">산들마을 입주민 포털</div>
  <nav class="tabs" id="tabs"></nav>
  <div class="tools">
    <button id="reloadBtn" title="현재 탭 새로고침">↻</button>
    <a id="openBtn" href="#" target="_blank" rel="noopener" title="현재 탭을 새 창으로">새 창 ↗</a>
  </div>
</header>
<main id="main"></main>
<script>
// 한 페이지 안에서 하위 서비스를 탭으로 전환해 보여 주는 껍데기. 각 탭은 iframe(같은 호스트는 로그인/관리자 키 공유).
// 주소 #탭id 로 기억·공유. 새 탭(서비스)을 더하려면 SERVICES에 한 줄 추가.
var SERVICES = [
  { id: "minutes",   label: "◆ 회의록",         cls: "",        url: "https://sandleapt.github.io/minutes/" },
  { id: "archive",   label: "이전 회의록",      cls: "",        url: "https://sandleapt.github.io/minutes/?tab=archiveView" },
  { id: "topics",    label: "주제별 보기",      cls: "",        url: "https://sandleapt.github.io/minutes/?tab=topicView" },
  { id: "haja",      label: "하자판결금",       cls: "",        url: "https://sandleapt.github.io/minutes/?tab=hajaView" },
  { id: "work",      label: "업무현황",         cls: "t-green", url: "https://valuable-silicon-f1f.notion.site/3b15f4b3bcdd81f9a550e8d3cf46e48d" },
  { id: "docs",      label: "자료",             cls: "t-green", url: "https://valuable-silicon-f1f.notion.site/3b25f4b3bcdd811c8b36d98110d9ef79" },
  { id: "community", label: "◇ 커뮤니티센터",   cls: "t-teal",  url: "https://sandleapt.github.io/CommunityNotice/" }
];
var tabs = document.getElementById("tabs"), main = document.getElementById("main"), openBtn = document.getElementById("openBtn");
var current = null;
SERVICES.forEach(function (s) {
  var b = document.createElement("button"); b.textContent = s.label; b.className = s.cls; b.dataset.id = s.id; b.onclick = function () { show(s.id, true); };
  tabs.appendChild(b);
  var p = document.createElement("div"); p.className = "pane"; p.id = "pane-" + s.id;
  p.innerHTML = '<div class="loading"></div><div class="fallback"><div><b>이 화면은 포털 안에 끼워 넣을 수 없게 설정되어 있습니다.</b><br>새 창에서 열어 주세요.<br><a href="' + s.url + '" target="_blank" rel="noopener">새 창에서 열기 ↗</a></div></div>';
  main.appendChild(p);
});
function ensureFrame(s) {
  var p = document.getElementById("pane-" + s.id);
  if (p.querySelector("iframe")) return p;
  var f = document.createElement("iframe"); f.src = s.url; f.title = s.label; f.setAttribute("loading", "eager");
  f.setAttribute("allow", "clipboard-write; fullscreen");
  p.classList.add("loading-on");
  var done = false;
  f.addEventListener("load", function () { done = true; p.classList.remove("loading-on"); });
  // 끼워 넣기를 막는 사이트(X-Frame-Options)는 load 는 오지만 내용이 비므로 일정 시간 뒤 안내 표시(같은 호스트는 검사 가능)
  setTimeout(function () {
    try {
      var sameHost = new URL(s.url).host === location.host;
      if (sameHost) { if (!f.contentDocument || !f.contentDocument.body || !f.contentDocument.body.childElementCount) p.classList.add("blocked"); }
      else if (!done) { /* 외부: 로딩이 길면 안내만, 차단 여부는 알 수 없음 */ }
    } catch (e) {}
  }, 6000);
  p.insertBefore(f, p.firstChild);
  return p;
}
function show(id, push) {
  var s = SERVICES.find(function (x) { return x.id === id; }) || SERVICES[0];
  current = s;
  document.querySelectorAll("nav.tabs button").forEach(function (b) { b.classList.toggle("active", b.dataset.id === s.id); });
  document.querySelectorAll(".pane").forEach(function (p) { p.classList.remove("active"); });
  ensureFrame(s).classList.add("active");
  openBtn.href = s.url;
  document.title = "산들마을 입주민 포털 — " + s.label.replace(/^[◆◇]\s*/, "");
  if (push) { try { history.replaceState(null, "", "#" + s.id); } catch (e) {} }
  var b = document.querySelector('nav.tabs button[data-id="' + s.id + '"]'); if (b && b.scrollIntoView) b.scrollIntoView({ inline: "nearest", block: "nearest" });
}
document.getElementById("reloadBtn").onclick = function () { if (!current) return; var p = document.getElementById("pane-" + current.id); var f = p.querySelector("iframe"); if (f) { p.classList.add("loading-on"); f.src = f.src; } };
window.addEventListener("hashchange", function () { show((location.hash || "").replace(/^#/, ""), false); });
show((location.hash || "").replace(/^#/, "") || "minutes", false);
</script>
</body>
</html>
