<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>산들마을 Archive v1 미리보기</title>
<meta name="description" content="산들마을 기록·규정·계약 통합 아카이브 구조 검증용 미리보기">
<link rel="stylesheet" href="./assets/archive.css">
</head>
<body>
<header class="top">
  <div class="top-inner">
    <a class="back" href="/">← 현재 포털</a>
    <div class="brand"><span class="mark">산</span><div><strong>산들마을 Archive v1</strong><small>구조 검증용 미리보기 · 전체 자료 아님</small></div></div>
    <span class="badge">PREVIEW</span>
  </div>
</header>
<main class="wrap">
  <section class="hero">
    <p class="eyebrow">지난 기록에서 지금의 기준까지</p>
    <h1>무엇을 찾아볼까?</h1>
    <p class="lead">회의록 한 장을 찾는 대신, 하나의 주제에 얽힌 <b>과거 논의 · 현재 기준 · 계약 · 비용 · 후속 결과</b>를 함께 보여주는 구조를 시험하고 있어.</p>
    <form id="searchForm" class="search">
      <span>⌕</span><input id="searchInput" autocomplete="off" placeholder="예: 헬스장, GX, 도서관, 주차, 선거"><button>검색</button>
    </form>
    <div id="quickTopics" class="quick"></div>
  </section>

  <section id="topicView" class="topic-view" aria-live="polite"></section>

  <section class="notice">
    <strong>이 화면의 역할</strong>
    <p>지금은 실제 10년치 데이터를 이관한 화면이 아니라, ‘어떤 정보를 어떤 순서로 보여줄지’를 검증하기 위한 Golden Sample UI야. 구조가 마음에 들 때만 작은 배치 단위로 실제 이관을 시작해.</p>
  </section>
</main>
<script src="./data/sample.js"></script>
<script src="./app.js"></script>
</body>
</html>
